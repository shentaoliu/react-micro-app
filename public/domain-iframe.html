<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Domain Iframe</title>
    <style>
      body {
        font-family: sans-serif;
        background: #fafafa;
        padding: 10px;
        margin: 0;
        font-size: 14px;
      }
      .box {
        border: 1px dashed #d46b08;
        padding: 10px;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h4>我是子 iframe</h4>
      <p>如果成功跨域，父页面可以读取我 window 上的变量。</p>
      <button onclick="setDomain()">1. 子页面设置 document.domain</button>
      <button onclick="readParentData()" style="margin-left: 8px">
        2. 读取父页面变量
      </button>
      <div
        id="parentDataMsg"
        style="margin-top: 10px; color: #d46b08; font-weight: bold"
      ></div>
    </div>

    <script>
      // 在 iframe 的全局 window 上挂载一个变量供父页面读取
      window.iframeSecretData = "【这是子域名的机密数据，价值百万！】";
      console.log("window.parent:", window.parent);
      function setDomain() {
        try {
          // 尝试设置 domain (必须和父级设置的保持一致)
          document.domain = "localhost";
          alert("子页面设置 domain 成功！");
        } catch (e) {
          alert("设置失败，当前环境可能不支持：" + e.message);
        }
      }

      // 提供给父页面调用的方法
      window.receiveDataFromParent = function (msg) {
        document.getElementById("parentDataMsg").innerText =
          "父页面主动调用了我：" + msg;
      };

      // 子页面主动读取父页面的变量
      function readParentData() {
        try {
          if (!document.domain) {
            alert("请先点击上方按钮设置 domain！");
            return;
          }
          // 跨域状态下，直接访问 parent.window 会报错
          // 但是在双方都设置了相同的 document.domain 后，就可以正常访问了
          const pData = parent.window.parentSecretData;
          if (pData) {
            document.getElementById("parentDataMsg").innerText =
              "成功读取父页面数据：" + pData;
          } else {
            document.getElementById("parentDataMsg").innerText =
              "尚未读取到父页面数据，请确认父页面已挂载数据。";
          }
        } catch (e) {
          alert("读取父页面数据失败 (被同源策略拦截)：" + e.message);
        }
      }
    </script>
  </body>
</html>
